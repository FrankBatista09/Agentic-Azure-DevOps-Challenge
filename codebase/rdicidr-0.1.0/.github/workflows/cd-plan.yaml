# CD (plan) for rdicidr: Terraform fmt/init/validate/plan on pull requests. Never applies.
# PR into devel -> devel plan, PR into stage -> stage plan. The plan is published in the job summary.
# Runs under the OIDC subject "pull_request" (no GitHub Environment, no approval gate).
# This file is kept byte-identical in two places:
#   .github/workflows/cd-plan.yaml                              (executed by GitHub)
#   codebase/rdicidr-0.1.0/.github/workflows/cd-plan.yaml       (submission copy, not executed by GitHub)
name: CD Plan

on:
  pull_request:
    # 'branches' filters on the BASE branch of the PR.
    branches:
      - devel
      - stage

permissions:
  contents: read

# Plans are queued per PR, never cancelled: killing terraform mid-run can leave the state lock behind.
concurrency:
  group: cd-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  TF_VERSION: 1.17.1
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  # Terraform azurerm provider 4.x and azurerm backend: OIDC for the API, Entra ID (no keys) for the state blob.
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

jobs:
  plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # OIDC token for Azure (federated credential subject: pull_request)
    defaults:
      run:
        working-directory: codebase/rdicidr-0.1.0/terraform
    env:
      BASE_REF: ${{ github.base_ref }}
      HEAD_REF: ${{ github.head_ref }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      TF_STATE_RESOURCE_GROUP: ${{ vars.TF_STATE_RESOURCE_GROUP }}
      TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
      TF_STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}
    steps:
      # Refs come from env vars, never inlined in the script (branch names are attacker-controlled text).
      - name: Enforce branching strategy and same-repository PR
        working-directory: .
        run: |
          case "$BASE_REF" in
            devel) case "$HEAD_REF" in feature/*|bugfix/*) ;; *) echo "::error::PRs into devel must come from feature/* or bugfix/* (got '$HEAD_REF')"; exit 1 ;; esac ;;
            stage) [ "$HEAD_REF" = "devel" ] || { echo "::error::Only devel may be merged into stage (got '$HEAD_REF')"; exit 1; } ;;
            *) echo "::error::Unsupported base branch '$BASE_REF'"; exit 1 ;;
          esac
          if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::Pull requests from forks get no OIDC token; push the branch to this repository instead."
            exit 1
          fi

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: Terraform init (remote backend, OIDC)
        run: |
          terraform init -lockfile=readonly \
            -backend-config="resource_group_name=${TF_STATE_RESOURCE_GROUP}" \
            -backend-config="storage_account_name=${TF_STATE_STORAGE_ACCOUNT}" \
            -backend-config="container_name=${TF_STATE_CONTAINER}" \
            -backend-config="key=${BASE_REF}.tfstate" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        run: |
          plan_txt="$RUNNER_TEMP/plan.txt"
          set +e
          terraform plan -no-color -detailed-exitcode -lock-timeout=5m \
            -var-file="env/${BASE_REF}.tfvars" \
            -var="image_tag=${HEAD_SHA}" \
            -out="$RUNNER_TEMP/tfplan" > "$plan_txt" 2>&1
          rc=$?
          set -e
          cat "$plan_txt"
          {
            echo "### Terraform plan for \`${BASE_REF}\` (commit \`${HEAD_SHA}\`)"
            case "$rc" in 0) echo "No changes." ;; 2) echo "Changes detected." ;; *) echo "Plan FAILED." ;; esac
            echo
            echo "<details><summary>Plan output</summary>"
            echo
            echo '```'
            head -c 800000 "$plan_txt"
            echo
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          # 0 = no changes, 2 = changes (both fine on a PR); anything else is a failure.
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit 1; fi
