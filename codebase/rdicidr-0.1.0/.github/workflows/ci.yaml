# CI pipeline for rdicidr. Strict chain: install -> lint -> test -> build.
# Runs on pull requests feature/* | bugfix/* -> devel and devel -> stage.
# This file is kept byte-identical in two places:
#   .github/workflows/ci.yaml                              (executed by GitHub)
#   codebase/rdicidr-0.1.0/.github/workflows/ci.yaml       (submission copy, not executed by GitHub)
name: CI Pipeline

on:
  pull_request:
    # 'branches' filters on the BASE branch of the PR.
    branches:
      - devel
      - stage
  # Reused by cd-deploy.yaml to re-run CI on the exact commit that is about to be deployed.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: codebase/rdicidr-0.1.0

jobs:
  install:
    # 'head_ref' is the PR source branch. Allowed: feature/*|bugfix/* -> devel, devel -> stage.
    # If this job is skipped, every downstream job is skipped too (needs chain).
    # When called from the CD workflow (push event) there is no PR: always run.
    if: >-
      github.event_name != 'pull_request' ||
      (github.base_ref == 'devel' &&
        (startsWith(github.head_ref, 'feature/') || startsWith(github.head_ref, 'bugfix/'))) ||
      (github.base_ref == 'stage' && github.head_ref == 'devel')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # node-sass 5 falls back to compiling from source when its prebuilt binding cannot be downloaded.
      # Its bundled node-gyp 7 cannot run on Python 3.12 (ValueError: invalid mode: 'rU'), so pin Python 3.11.
      - name: Set up Python (node-gyp 7 needs Python < 3.12)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: codebase/rdicidr-0.1.0/.nvmrc
          cache: npm
          cache-dependency-path: codebase/rdicidr-0.1.0/package-lock.json

      - name: Install dependencies
        run: npm ci

  lint:
    needs: [install]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # node-sass 5 falls back to compiling from source when its prebuilt binding cannot be downloaded.
      # Its bundled node-gyp 7 cannot run on Python 3.12 (ValueError: invalid mode: 'rU'), so pin Python 3.11.
      - name: Set up Python (node-gyp 7 needs Python < 3.12)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: codebase/rdicidr-0.1.0/.nvmrc
          cache: npm
          cache-dependency-path: codebase/rdicidr-0.1.0/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run formatter check
        run: npm run prettier

  test:
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # node-sass 5 falls back to compiling from source when its prebuilt binding cannot be downloaded.
      # Its bundled node-gyp 7 cannot run on Python 3.12 (ValueError: invalid mode: 'rU'), so pin Python 3.11.
      - name: Set up Python (node-gyp 7 needs Python < 3.12)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: codebase/rdicidr-0.1.0/.nvmrc
          cache: npm
          cache-dependency-path: codebase/rdicidr-0.1.0/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        env:
          CI: true
        run: npm run test

  build:
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # node-sass 5 falls back to compiling from source when its prebuilt binding cannot be downloaded.
      # Its bundled node-gyp 7 cannot run on Python 3.12 (ValueError: invalid mode: 'rU'), so pin Python 3.11.
      - name: Set up Python (node-gyp 7 needs Python < 3.12)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: codebase/rdicidr-0.1.0/.nvmrc
          cache: npm
          cache-dependency-path: codebase/rdicidr-0.1.0/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
